[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-finance-assistant"
version = "0.1.0"
description = "Multi-agent financial education assistant (LangGraph + RAG + Streamlit)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "langchain-anthropic>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-text-splitters>=0.3.0",
  "langchain-huggingface>=0.1.0",
  "sentence-transformers>=3.0.0",
  "faiss-cpu>=1.8.0",
  "streamlit>=1.38.0",
  "yfinance>=0.2.40",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "pyyaml>=6.0.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "tenacity>=8.2.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["ai_finance_assistant"]
omit = ["*/tests/*"]
